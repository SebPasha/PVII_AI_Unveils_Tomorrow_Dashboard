<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const CUR = DATA.currency;
const $ = (s) => document.querySelector(s);

// ---------------------------------------------------------------- formatting
const fmt = (v) => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return (v / 1e3).toFixed(1) + "k";
  if (a >= 100) return v.toFixed(0);
  return v.toFixed(1);
};
const full = (v) => v.toLocaleString(undefined, { maximumFractionDigits: 1 });
const pct = (v) => (100 * v).toFixed(1) + "%";

// ------------------------------------------------------------------- filters
const state = { year: "all", risk: "all", sector: "all", sal: "all", q: "" };

function options(sel, values, allLabel) {
  sel.textContent = "";
  const mk = (v, t) => { const o = document.createElement("option");
    o.value = v; o.textContent = t; sel.appendChild(o); };
  mk("all", allLabel);
  values.forEach(v => mk(v, v));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.edges.filter(e =>
    (state.year === "all" || e.y === state.year) &&
    (state.risk === "all" || e.rk.indexOf(state.risk) !== -1) &&
    (state.sector === "all" || e.sec === state.sector) &&
    (state.sal === "all" || e.sal === state.sal) &&
    (!q || e.s.toLowerCase().indexOf(q) !== -1));
}

// A programme's money counts ONCE per year however many strategies it funds.
function moneyByYear(edges) {
  const seen = new Set(), out = {};
  for (const e of edges) {
    const k = e.p + "|" + e.y;
    if (seen.has(k)) continue;
    seen.add(k);
    out[e.y] = (out[e.y] || 0) + e.a;
  }
  return out;
}

// Exposure: sum over DISTINCT programmes carrying the key. Not additive across keys.
function exposure(edges, keyOf) {
  const seen = new Set(), out = new Map();
  for (const e of edges) {
    for (const k of keyOf(e)) {
      if (!k) continue;
      const dedupe = k + "|" + e.p + "|" + e.y;
      if (seen.has(dedupe)) continue;
      seen.add(dedupe);
      const cur = out.get(k) || { total: 0, byYear: {}, progs: new Set(), strats: new Set() };
      cur.total += e.a;
      cur.byYear[e.y] = (cur.byYear[e.y] || 0) + e.a;
      cur.progs.add(e.p);
      out.set(k, cur);
    }
    for (const k of keyOf(e)) {
      if (k) out.get(k).strats.add(e.s);
    }
  }
  return [...out.entries()].map(([k, v]) => ({ key: k, ...v })).sort((a, b) => b.total - a.total);
}

// -------------------------------------------------------------------- tooltip
const tip = $("#tip");
function showTip(ev, rows, title) {
  tip.textContent = "";
  if (title) { const h = document.createElement("div");
    h.className = "tl"; h.textContent = title; tip.appendChild(h); }
  for (const r of rows) {
    const d = document.createElement("div");
    if (r.color) { const k = document.createElement("span");
      k.className = "key"; k.style.background = r.color; d.appendChild(k); }
    const v = document.createElement("span");
    v.className = "tv1"; v.textContent = r.value;      // untrusted data -> textContent
    d.appendChild(v);
    if (r.label) { const l = document.createElement("span");
      l.className = "tl"; l.textContent = "  " + r.label; d.appendChild(l); }
    tip.appendChild(d);
  }
  tip.style.opacity = "1";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };
addEventListener("scroll", hideTip, { passive: true });

// ------------------------------------------------------------------- drawing
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

function card(id, title, caption) {
  const c = document.createElement("section");
  c.className = "card" + (id === "table" || id === "heat" ? " wide" : "");
  const h = document.createElement("h2"); h.textContent = title; c.appendChild(h);
  if (caption) { const p = document.createElement("p");
    p.className = "cap"; p.textContent = caption; c.appendChild(p); }
  const body = document.createElement("div"); body.id = "c-" + id; c.appendChild(body);
  return { card: c, body };
}

/* Ranked horizontal bars. ONE measure -> one hue, never a cycled set.
   4px rounded data-end, anchored to the baseline; 2px surface gap between bars. */
function rankedBars(host, rows, opts) {
  const { unit, color = "var(--series-1)", limit = 12 } = opts || {};
  opts = opts || {};
  const data = rows.slice(0, limit);
  if (!data.length) { host.innerHTML = '<p class="empty">No rows match these filters.</p>'; return; }
  const max = Math.max(...data.map(d => d.value)) || 1;
  const rowH = 30, padL = 210, padR = 78, top = 6;
  const H = data.length * rowH + top + 4, W = 720;
  const bw = W - padL - padR;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });

  data.forEach((d, i) => {
    const y = top + i * rowH;
    const w = Math.max(2, (d.value / max) * bw);
    const lab = el("text", { x: padL - 10, y: y + 15, "text-anchor": "end", class: "lbl" });
    lab.textContent = d.key.length > 34 ? d.key.slice(0, 33) + "…" : d.key;
    svg.appendChild(lab);
    const g = el("g", { class: "mark", tabindex: "0", role: "listitem" });
    const r = el("rect", { x: padL, y: y + 4, width: w, height: rowH - 12,
                           rx: 4, fill: color });
    g.appendChild(r);
    const v = el("text", { x: padL + w + 8, y: y + 15, class: "val" });
    v.textContent = fmt(d.value);
    g.appendChild(v);
    const share = opts && opts.total ? d.value / opts.total : 0;
    const rows_ = [{ value: full(d.value) + " " + unit, label: "", color },
                   { value: share ? pct(share) : "-", label: "of financing mapped" },
                   { value: d.count + "", label: d.countLabel || "programmes" }];
    g.addEventListener("pointermove", (e) => showTip(e, rows_, d.key));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("focus", (e) => showTip(
      { clientX: padL + w, clientY: y + 40 }, rows_, d.key));
    g.addEventListener("blur", hideTip);
    svg.appendChild(g);
  });
  host.textContent = "";
  host.appendChild(svg);
  host.appendChild(tableView(["Category", "Amount (" + unit + ")", "Programmes"],
    data.map(d => [d.key, full(d.value), String(d.count)]), [false, true, true]));
}

/* Grouped bars, one series per year. Two series -> slots 1 and 2, validated. */
function groupedBars(host, rows, years, opts) {
  const { unit, limit = 12 } = opts || {};
  const data = rows.slice(0, limit);
  if (!data.length) { host.innerHTML = '<p class="empty">No rows match these filters.</p>'; return; }
  const colors = ["var(--series-1)", "var(--series-2)"];
  const max = Math.max(...data.flatMap(d => years.map(y => d.byYear[y] || 0))) || 1;
  const barH = 11, gap = 2, rowH = years.length * (barH + gap) + 16;
  const padL = 210, padR = 78, top = 6;
  const H = data.length * rowH + top + 4, W = 720, bw = W - padL - padR;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });

  data.forEach((d, i) => {
    const y0 = top + i * rowH;
    const lab = el("text", { x: padL - 10, y: y0 + 14, "text-anchor": "end", class: "lbl" });
    lab.textContent = d.key.length > 34 ? d.key.slice(0, 33) + "…" : d.key;
    svg.appendChild(lab);
    years.forEach((yr, j) => {
      const v = d.byYear[yr] || 0;
      const w = Math.max(2, (v / max) * bw);
      const y = y0 + 4 + j * (barH + gap);
      const g = el("g", { class: "mark", tabindex: "0" });
      g.appendChild(el("rect", { x: padL, y, width: w, height: barH, rx: 4,
                                 fill: colors[j % colors.length] }));
      if (j === years.length - 1) {
        const t = el("text", { x: padL + w + 8, y: y + barH - 1, class: "val" });
        t.textContent = fmt(v);
        g.appendChild(t);
      }
      const rows_ = years.map((yy, k) => ({
        value: full(d.byYear[yy] || 0) + " " + unit, label: "FY" + yy,
        color: colors[k % colors.length] }));
      g.addEventListener("pointermove", (e) => showTip(e, rows_, d.key));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", () => showTip(
        { clientX: padL + w, clientY: y + 40 }, rows_, d.key));
      g.addEventListener("blur", hideTip);
      svg.appendChild(g);
    });
  });
  const leg = document.createElement("div");
  leg.className = "legend";
  years.forEach((yr, j) => {
    const s = document.createElement("span");
    const i2 = document.createElement("i");
    i2.className = "sq"; i2.style.background = colors[j % colors.length];
    s.appendChild(i2);
    s.appendChild(document.createTextNode("FY" + yr));
    leg.appendChild(s);
  });
  host.textContent = "";
  host.appendChild(leg);
  host.appendChild(svg);
  host.appendChild(tableView(["Category", ...years.map(y => "FY" + y + " (" + unit + ")")],
    data.map(d => [d.key, ...years.map(y => full(d.byYear[y] || 0))]),
    [false, ...years.map(() => true)]));
}

/* Column labels that all begin the same way ("Ministerio da Previdencia Social",
   "Ministerio da Economia") truncate to six identical headers. Drop the shared leading
   words so the distinguishing part is what survives; the full name stays in the tooltip. */
function dropCommonPrefix(labels) {
  if (labels.length < 2) return labels.slice();
  const words = labels.map(l => l.split(/\s+/));
  let n = 0;
  while (n < Math.min(...words.map(w => w.length)) - 1) {
    const w = words[0][n].toLowerCase();
    if (!words.every(x => x[n].toLowerCase() === w)) break;
    n++;
  }
  if (n === 0) return labels.slice();
  // The shared run usually ends mid-phrase ("Ministerio" | "da Economia"), so a leading
  // preposition is left stranded on every label. Drop it.
  const STOP = /^(da|de|do|das|dos|of|the|for|d')\s+/i;
  return words.map(w => w.slice(n).join(" ").replace(STOP, ""));
}

/* Heatmap: magnitude across two categoricals -> ONE hue, light to dark. */
function heatmap(host, rowKeys, colKeys, get, unit) {
  if (!rowKeys.length || !colKeys.length) {
    host.innerHTML = '<p class="empty">No rows match these filters.</p>'; return; }
  const steps = ["var(--seq-1)", "var(--seq-2)", "var(--seq-3)", "var(--seq-4)", "var(--seq-5)"];
  const vals = [];
  rowKeys.forEach(r => colKeys.forEach(c => { const v = get(r, c); if (v > 0) vals.push(v); }));
  const max = Math.max(...vals, 1);
  const cw = 108, ch = 30, padL = 230, top = 26;
  const W = padL + colKeys.length * cw + 12, H = top + rowKeys.length * ch + 8;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });

  const colLabels = dropCommonPrefix(colKeys);
  colKeys.forEach((c, j) => {
    const t = el("text", { x: padL + j * cw + cw / 2, y: 16, "text-anchor": "middle",
                           class: "lbl" });
    const lab = colLabels[j];
    t.textContent = lab.length > 15 ? lab.slice(0, 14) + "…" : lab;
    const ttl = el("title"); ttl.textContent = c; t.appendChild(ttl);
    svg.appendChild(t);
  });
  rowKeys.forEach((r, i) => {
    const y = top + i * ch;
    const t = el("text", { x: padL - 10, y: y + 19, "text-anchor": "end", class: "lbl" });
    t.textContent = r.length > 36 ? r.slice(0, 35) + "…" : r;
    svg.appendChild(t);
    colKeys.forEach((c, j) => {
      const v = get(r, c);
      const idx = v <= 0 ? -1 : Math.min(steps.length - 1,
        Math.floor(Math.sqrt(v / max) * steps.length));
      const g = el("g", { class: "mark", tabindex: "0" });
      g.appendChild(el("rect", { x: padL + j * cw + 1, y: y + 1, width: cw - 3, height: ch - 3,
        rx: 4, fill: idx < 0 ? "var(--surface-2)" : steps[idx] }));
      if (v > 0) {
        const lt = el("text", { x: padL + j * cw + cw / 2, y: y + 19, "text-anchor": "middle",
          class: "val", fill: idx >= 3 ? "#fff" : "var(--text-primary)" });
        lt.textContent = fmt(v);
        g.appendChild(lt);
      }
      const rows_ = [{ value: v > 0 ? full(v) + " " + unit : "no financing" }];
      g.addEventListener("pointermove", (e) => showTip(e, rows_, r + "  ·  " + c));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("blur", hideTip);
      svg.appendChild(g);
    });
  });
  const scale = document.createElement("div");
  scale.className = "legend";
  const lo = document.createElement("span"); lo.textContent = "low";
  scale.appendChild(lo);
  steps.forEach(s => { const i2 = document.createElement("i");
    i2.className = "sq"; i2.style.background = s; scale.appendChild(i2); });
  const hi = document.createElement("span"); hi.textContent = "high";
  scale.appendChild(hi);
  host.textContent = "";
  host.appendChild(scale);
  const sc = document.createElement("div"); sc.style.overflowX = "auto";
  sc.appendChild(svg); host.appendChild(sc);
  host.appendChild(tableView(["Row", ...colKeys],
    rowKeys.map(r => [r, ...colKeys.map(c => { const v = get(r, c); return v ? full(v) : "—"; })]),
    [false, ...colKeys.map(() => true)]));
}

function tableView(cols, rows, numeric) {
  const d = document.createElement("details");
  d.className = "tv";
  const s = document.createElement("summary");
  s.textContent = "Table view (" + rows.length + " rows)";
  d.appendChild(s);
  const wrap = document.createElement("div"); wrap.className = "scroll";
  const t = document.createElement("table");
  const thead = document.createElement("thead"), tr = document.createElement("tr");
  cols.forEach((c, i) => { const th = document.createElement("th");
    if (numeric && numeric[i]) th.className = "n";
    th.textContent = c; tr.appendChild(th); });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  rows.forEach(r => { const trr = document.createElement("tr");
    r.forEach((v, i) => { const td = document.createElement("td");
      if (numeric && numeric[i]) td.className = "n";
      td.textContent = v; trr.appendChild(td); });
    tb.appendChild(trr); });
  t.appendChild(tb); wrap.appendChild(t); d.appendChild(wrap);
  return d;
}

// --------------------------------------------------------------------- render
function render() {
  const edges = filtered();
  const years = state.year === "all" ? DATA.years : [state.year];
  const money = moneyByYear(edges);
  const matched = years.reduce((s, y) => s + (money[y] || 0), 0);
  const national = years.reduce((s, y) => s + (DATA.national[y] || 0), 0);
  const strategies = new Set(edges.map(e => e.s)).size;
  const programmes = new Set(edges.map(e => e.p)).size;

  $("#count").textContent = edges.length + " edge(s) · " + strategies + " strateg" +
    (strategies === 1 ? "y" : "ies") + " · " + programmes + " programme(s)";

  // ---- tiles
  const tiles = [
    ["Financing mapped", fmt(matched), CUR],
    ["Share of national budget", national ? pct(matched / national) : "—",
      national ? "of " + fmt(national) + " " + CUR : "national total unavailable"],
    ["Strategies", String(strategies), DATA.n_unfunded + " unfunded in full panel"],
    ["Budget programmes", String(programmes), "distinct, counted once per year"],
  ];
  const th = $("#tiles"); th.textContent = "";
  tiles.forEach(([k, v, u]) => {
    const d = document.createElement("div"); d.className = "tile";
    const kk = document.createElement("div"); kk.className = "k"; kk.textContent = k;
    const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v;
    const uu = document.createElement("div"); uu.className = "u"; uu.textContent = u;
    d.append(kk, vv, uu); th.appendChild(d);
  });

  // ---- cards
  const grid = $("#grid"); grid.textContent = "";
  const byRisk = exposure(edges, e => e.rk);
  const bySector = exposure(edges, e => [e.sec]);

  const c1 = card("risk", "Financing by risk addressed",
    "Portfolio exposure: each risk sums the distinct programmes tagged with it. Risks "
    + "overlap, so these do not add up to the total. The scale is linear and unclipped, so "
    + "one very large programme flattens the rest; hover any bar for its share.");
  grid.appendChild(c1.card);
  if (years.length > 1) {
    groupedBars(c1.body, byRisk.map(r => ({ key: r.key, byYear: r.byYear,
      count: r.progs.size })), years, { unit: CUR });
  } else {
    rankedBars(c1.body, byRisk.map(r => ({ key: r.key, value: r.total,
      count: r.progs.size })), { unit: CUR, total: matched });
  }

  const c2 = card("sector", "Financing by sector", "One measure, ranked. Top 12 shown.");
  grid.appendChild(c2.card);
  rankedBars(c2.body, bySector.map(r => ({ key: r.key || "(not stated)", value: r.total,
    count: r.progs.size })), { unit: CUR, total: matched });

  const byHdi = exposure(edges, e => [e.hdi]);
  if (byHdi.length && byHdi.some(h => h.key)) {
    const cH = card("hdi", "Financing by human development category",
      "Portfolio exposure by HDI category, on the same counting rule as the risk chart.");
    grid.appendChild(cH.card);
    rankedBars(cH.body, byHdi.filter(h => h.key).map(r => ({ key: r.key, value: r.total,
      count: r.progs.size })), { unit: CUR, total: matched });
  }

  const c3 = card("heat", "Risk by sector", "Financing where a risk and a sector meet.");
  grid.appendChild(c3.card);
  const topSectors = bySector.slice(0, 6).map(s => s.key || "(not stated)");
  const topRisks = byRisk.slice(0, 11).map(r => r.key);
  const cell = new Map();
  {
    const seen = new Set();
    for (const e of edges) {
      const sec = e.sec || "(not stated)";
      if (topSectors.indexOf(sec) === -1) continue;
      for (const rk of e.rk) {
        const k = rk + "|" + sec;
        const dedupe = k + "|" + e.p + "|" + e.y;
        if (seen.has(dedupe)) continue;
        seen.add(dedupe);
        cell.set(k, (cell.get(k) || 0) + e.a);
      }
    }
  }
  heatmap(c3.body, topRisks, topSectors, (r, c) => cell.get(r + "|" + c) || 0, CUR);

  // ---- strategy table
  const c4 = card("table", "Strategies", "Every strategy in the current filter, with the "
    + "programmes funding it. Financing counts each programme once per year.");
  grid.appendChild(c4.card);
  const byStrategy = new Map();
  {
    const seen = new Set();
    for (const e of edges) {
      const cur = byStrategy.get(e.s) ||
        { total: 0, byYear: {}, progs: new Set(), risks: new Set(), sec: e.sec };
      const k = e.s + "|" + e.p + "|" + e.y;
      if (!seen.has(k)) {
        seen.add(k);
        cur.total += e.a;
        cur.byYear[e.y] = (cur.byYear[e.y] || 0) + e.a;
      }
      cur.progs.add(e.p);
      e.rk.forEach(r => cur.risks.add(r));
      byStrategy.set(e.s, cur);
    }
  }
  const srows = [...byStrategy.entries()].sort((a, b) => b[1].total - a[1].total)
    .map(([s, v]) => [s, v.sec || "—", [...v.risks].join(", ") || "—",
      String(v.progs.size), ...years.map(y => full(v.byYear[y] || 0))]);
  const tv = tableView(["Strategy", "Sector", "Risks", "Programmes",
    ...years.map(y => "FY" + y + " (" + CUR + ")")], srows,
    [false, false, false, true, ...years.map(() => true)]);
  tv.open = true;
  c4.body.appendChild(tv);
}

// ---------------------------------------------------------------------- wire
(function init() {
  const risks = [...new Set(DATA.edges.flatMap(e => e.rk))].sort();
  const sectors = [...new Set(DATA.edges.map(e => e.sec).filter(Boolean))].sort();
  const sals = [...new Set(DATA.edges.map(e => e.sal).filter(Boolean))].sort();
  options($("#f-year"), DATA.years, "All years");
  options($("#f-risk"), risks, "All risks");
  options($("#f-sector"), sectors, "All sectors");
  options($("#f-sal"), sals, "Any salience");
  if (!sals.length) $("#f-sal").parentElement.style.display = "none";

  const bind = (id, key) => $(id).addEventListener("input", (e) => {
    state[key] = e.target.value; render(); });
  bind("#f-year", "year"); bind("#f-risk", "risk");
  bind("#f-sector", "sector"); bind("#f-sal", "sal"); bind("#f-q", "q");
  $("#reset").addEventListener("click", () => {
    Object.assign(state, { year: "all", risk: "all", sector: "all", sal: "all", q: "" });
    ["#f-year", "#f-risk", "#f-sector", "#f-sal"].forEach(s => { $(s).value = "all"; });
    $("#f-q").value = ""; render();
  });
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });
  render();
})();
</script>
